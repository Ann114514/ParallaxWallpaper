name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Depth Anything V2 model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o app/src/main/assets/depthanythingv2-vits-dynamic-quant.onnx \
            "https://raw.githubusercontent.com/combatwombat/tiefling/main/site/public/models/depthanythingv2-vits-dynamic-quant.onnx"

      - name: Verify model
        run: |
          ls -lh app/src/main/assets/depthanythingv2-vits-dynamic-quant.onnx
          test $(stat -c%s app/src/main/assets/depthanythingv2-vits-dynamic-quant.onnx) -gt 1000000

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxWallpaper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
